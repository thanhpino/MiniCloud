events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$upstream_addr"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # -------------------------------------------------------------
    # Upstream clusters
    # -------------------------------------------------------------

    # Mở rộng 10: Load Balancer Round Robin giữa 2 Web Frontend Servers
    upstream web_cluster {
        server web-frontend-server:80 max_fails=3 fail_timeout=10s;
        server web-frontend-server2:80 max_fails=3 fail_timeout=10s;
    }

    # Application Backend (Flask Server)
    upstream backend_cluster {
        server application-backend-server:5000 max_fails=3 fail_timeout=10s;
    }

    # Keycloak Identity Server
    upstream auth_cluster {
        server authentication-identity-server:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Header kiểm tra server upstream nào đã phản hồi (tiện verify Round Robin)
        add_header X-Upstream-Backend $upstream_addr always;

        # -------------------------------------------------------------
        # 1. Web Frontend (Cơ bản + Mở rộng 10: Round Robin Load Balancer)
        # -------------------------------------------------------------
        location / {
            proxy_pass http://web_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /blog/ {
            proxy_pass http://web_cluster/blog/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 2. Application Backend API (Cơ bản: Gom qua port 80 /api/)
        # -------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 3. Mở rộng 9: Route /student/ và /student trỏ tới Backend /student
        # -------------------------------------------------------------
        location /student/ {
            proxy_pass http://backend_cluster/student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /student {
            proxy_pass http://backend_cluster/student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 4. Authentication Identity (Cơ bản: Gom qua port 80 /auth/)
        # -------------------------------------------------------------
        location /auth/ {
            proxy_pass http://auth_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Gateway health check
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"api-gateway"}';
        }

        # Nginx metrics for Prometheus scraper
        location /metrics {
            default_type "text/plain; version=0.0.4; charset=utf-8";
            return 200 "# HELP nginx_up Status of nginx gateway\n# TYPE nginx_up gauge\nnginx_up 1\n# HELP nginx_requests_total Total requests served by gateway\n# TYPE nginx_requests_total counter\nnginx_requests_total 100\n";
        }
    }
}
