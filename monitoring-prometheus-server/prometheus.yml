# Global Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (optional)
alerting:
  alertmanagers: []

# Rule files (optional)
rule_files: []

# Scrape Configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # -------------------------------------------------------------
  # Cơ bản (0.5đ): Scrape Node Exporter container
  # -------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['monitoring-node-exporter-server:9100']
    relabel_configs:
      - target_label: instance
        replacement: 'node-exporter'

  # -------------------------------------------------------------
  # Mở rộng 7 (0.5đ): Scrape Web Frontend Server 1 & Server 2
  # -------------------------------------------------------------
  - job_name: 'web-frontend'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['web-frontend-server:80']
        labels:
          app: 'web-frontend-1'
          env: 'production'
      - targets: ['web-frontend-server2:80']
        labels:
          app: 'web-frontend-2'
          env: 'production'

  # Scrape Nginx API Gateway Proxy Server
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway-proxy-server:80']
        labels:
          app: 'api-gateway'
