server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Prometheus exposition format metrics (Mở rộng 7)
    location /metrics {
        default_type "text/plain; version=0.0.4; charset=utf-8";
        return 200 "# HELP nginx_up Status of nginx server\n# TYPE nginx_up gauge\nnginx_up 1\n# HELP nginx_requests_total Total HTTP requests served\n# TYPE nginx_requests_total counter\nnginx_requests_total 42\n";
    }
}
