services:
  # ============================================================================
  # 👥 PHÂN CÔNG: TRƯƠNG MINH THÀNH (MSSV: 524H0032) - INFRA, SECURITY & MONITORING
  # ============================================================================

  # 1. Internal DNS Server (Bind9)
  internal-dns-server:
    build:
      context: ./internal-dns-server
      dockerfile: Dockerfile
    container_name: internal-dns-server
    restart: unless-stopped
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    networks:
      cloud-net:
        ipv4_address: 172.28.0.53

  # 2. Node Exporter (Metrics Agent cho Prometheus)
  monitoring-node-exporter-server:
    image: prom/node-exporter:v1.8.2
    container_name: monitoring-node-exporter-server
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      cloud-net:
        ipv4_address: 172.28.0.61

  # 3. Prometheus Server
  monitoring-prometheus-server:
    image: prom/prometheus:v2.54.1
    container_name: monitoring-prometheus-server
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - monitoring-node-exporter-server
    networks:
      cloud-net:
        ipv4_address: 172.28.0.60

  # 4. Grafana Dashboard Server
  monitoring-grafana-dashboard-server:
    image: grafana/grafana:12.3.0
    container_name: monitoring-grafana-dashboard-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring-grafana-dashboard-server/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring-grafana-dashboard-server/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - monitoring-prometheus-server
    networks:
      cloud-net:
        ipv4_address: 172.28.0.62

  # 5. Keycloak Authentication & Identity Server
  authentication-identity-server:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: authentication-identity-server
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/auth
    volumes:
      - ./authentication-identity-server/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"
    networks:
      cloud-net:
        ipv4_address: 172.28.0.50

  # 6. API Gateway / Reverse Proxy & Load Balancer (Nginx)
  api-gateway-proxy-server:
    build:
      context: ./api-gateway-proxy-server
      dockerfile: Dockerfile
    container_name: api-gateway-proxy-server
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - web-frontend-server
      - web-frontend-server2
      - application-backend-server
      - authentication-identity-server
    networks:
      cloud-net:
        ipv4_address: 172.28.0.10

  # ============================================================================
  # 👥 PHÂN CÔNG: TRƯƠNG CAO SANG (MSSV: 524H0125) - APPLICATION, DATA & STORAGE
  # ============================================================================

  # 7. Web Frontend Server 1
  web-frontend-server:
    image: ${DOCKERHUB_USERNAME}/myminicloud-web:v1
    build:
      context: ./web-frontend-server
      dockerfile: Dockerfile
    container_name: web-frontend-server
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      cloud-net:
        ipv4_address: 172.28.0.11

  # 8. Web Frontend Server 2 (Load Balancer Round Robin Partner)
  web-frontend-server2:
    image: ${DOCKERHUB_USERNAME}/myminicloud-web2:v1
    build:
      context: ./web-frontend-server2
      dockerfile: Dockerfile
    container_name: web-frontend-server2
    restart: unless-stopped
    ports:
      - "8082:80"
    networks:
      cloud-net:
        ipv4_address: 172.28.0.12

  # 9. Application Backend Server (Flask REST API)
  application-backend-server:
    image: ${DOCKERHUB_USERNAME}/myminicloud-backend:v1
    build:
      context: ./application-backend-server
      dockerfile: Dockerfile
    container_name: application-backend-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=relational-database-server
      - DB_PORT=3306
      - DB_USER=minicloud_user
      - DB_PASSWORD=minicloud_pass
      - DB_NAME=studentdb
    depends_on:
      - relational-database-server
    networks:
      cloud-net:
        ipv4_address: 172.28.0.20

  # 10. Relational Database Server (MariaDB)
  relational-database-server:
    image: mariadb:10.11
    container_name: relational-database-server
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=minicloud
      - MYSQL_USER=minicloud_user
      - MYSQL_PASSWORD=minicloud_pass
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3308:3306"
    networks:
      cloud-net:
        ipv4_address: 172.28.0.30

  # 11. Object Storage Server (MinIO)
  object-storage-server:
    image: cgr.dev/chainguard/minio:latest
    container_name: object-storage-server
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      cloud-net:
        ipv4_address: 172.28.0.40

networks:
  cloud-net:
    name: cloud-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
